name: Deploy Backend

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build bootJar
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar --no-daemon
          # take the boot jar (skip -plain) and give it a fixed name at repo root
          JAR=$(ls build/libs/*.jar | grep -v plain | head -1)
          cp "$JAR" app.jar
          echo "Prepared app.jar from $JAR"
          ls -la app.jar

      - name: Copy jar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          source:   app.jar
          target:   /tmp/syncwatch-deploy/

      - name: Install jar & restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            set -e
            test -f /tmp/syncwatch-deploy/app.jar
            sudo mv /tmp/syncwatch-deploy/app.jar ${{ secrets.BACKEND_DIR }}/app.jar
            sudo systemctl restart syncwatch-backend
            sleep 5
            curl -fsS http://127.0.0.1:8080/api/health && echo " ✓ backend healthy"
